name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore SysMonCmdPal.Tests/SysMonCmdPal.Tests.csproj
      - run: dotnet test SysMonCmdPal.Tests/SysMonCmdPal.Tests.csproj --configuration Debug --no-restore --logger "trx;LogFileName=test-results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: SysMonCmdPal.Tests/TestResults/**/*.trx
